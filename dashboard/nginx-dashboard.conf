# Deployed as /etc/nginx/conf.d/dashboard.conf on Larry.
# Dedicated :443 server for the maintenance dashboard, HTTP basic-auth, proxied
# to the local Flask app on 127.0.0.1:8090. Reuses the larry.home.arpa cert.
server {
    listen 443 ssl;
    server_name larry.home.arpa;
    ssl_certificate     /etc/nginx/ssl/larry.crt;
    ssl_certificate_key /etc/nginx/ssl/larry.key;

    location = / { return 302 /dash/; }

    location /dash/ {
        auth_basic           "Larry Maintenance";
        auth_basic_user_file /etc/nginx/dash.htpasswd;
        proxy_pass           http://127.0.0.1:8090/;
        proxy_set_header     Host $host;
        proxy_read_timeout   3600s;   # long ollama pulls/updates stream via job polling
    }
}
