# ~/.tmux.conf — hand-rolled powerline status bar (Tokyo Night), zero deps.
# Glyphs need a Nerd Font in the Windows-side terminal. tmux 3.5a.

# ── general ──────────────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"            # truecolor
set -ga terminal-overrides ",*256col*:Tc"
# Pick the shell that exists on this host. Hardcoding /usr/bin/zsh makes the whole
# server fail to start where there is no zsh — on Windows (psmux under Git Bash)
# every session dies with "spawn shell error: CreateProcessW /usr/bin/zsh".
# Hardcoding /usr/bin/zsh kills the whole server where there is no zsh — on Windows
# (psmux under Git Bash) every session died with
#   "spawn shell error: CreateProcessW /usr/bin/zsh".
# Guard it. Note tmux does NOT expand ${SHELL} here (it execs the literal string),
# and on Windows `if-shell` itself runs under psmux's default shell (PowerShell),
# so a POSIX test simply evaluates false — which is the behaviour we want.
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

set -g  mouse on
set -g  base-index 1                          # windows start at 1
setw -g pane-base-index 1
set -g  renumber-windows on                   # close a window → renumber
set -sg escape-time 0                         # no lag for vim <Esc>
set -g  history-limit 100000
set -g  focus-events on
setw -g mode-keys vi
set -g  status-interval 5                      # refresh clock/git/cpu/battery every 5s
set -g  status-position top

# prefix C-b -> C-a  (C-a a sends a literal C-a to the shell)
unbind C-b
set -g  prefix C-a
bind C-a send-prefix

# reload conf
bind r source-file ~/.tmux.conf \; display-message "  ~/.tmux.conf reloaded"

# saner splits — keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# named new window in one step (keeps cwd)
bind C command-prompt -p "new window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# ── palette (Tokyo Night) ────────────────────────────────────────────
# bg #1a1b26  bg2 #3b4261  fg #c0caf5  gray #565f89
# blue #7aa2f7  cyan #7dcfff  green #9ece6a  purple #bb9af7  dark #16161e

# ── status bar ───────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g message-style "bg=#3b4261,fg=#c0caf5"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# left: session block
set -g status-left-length 40
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26]"

# windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I #W "
set -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[fg=#16161e,bg=#bb9af7,bold] #I #W #[fg=#bb9af7,bg=#1a1b26]"

# right: git branch · cpu · battery · host · clock
set -g status-right-length 160
set -g status-right "#[fg=#3b4261,bg=#1a1b26]#[fg=#7dcfff,bg=#3b4261]  #(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#e0af68,bg=#3b4261]#[fg=#16161e,bg=#e0af68,bold]#(~/.config/tmux/cpu.sh) #(~/.config/tmux/battery.sh '#e0af68' '#7aa2f7')#[fg=#16161e,bg=#7aa2f7,bold]  #H #[fg=#bb9af7,bg=#7aa2f7]#[fg=#16161e,bg=#bb9af7,bold]  %a %d %b %H:%M "

# ── host-local overrides (untracked) ─────────────────────────────────
# Anything host-specific goes here rather than forking this file. On Windows
# it sets default-shell to Git Bash, without which the #() status commands
# (cpu.sh / battery.sh / git) run under PowerShell and silently produce nothing.
source-file -q ~/.config/tmux/local.conf
