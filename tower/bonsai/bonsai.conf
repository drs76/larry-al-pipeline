# /etc/nginx/conf.d/bonsai.conf — TLS proxy for the Ternary-Bonsai llama-server.
# Mirrors larry.conf (ollama 11443). Bonsai binds 127.0.0.1:8091; this exposes it
# as https://larry.home.arpa:8444/ for pi and other LAN clients.
server {
    listen 8444 ssl;
    server_name larry.home.arpa;

    ssl_certificate     /etc/nginx/ssl/larry.crt;
    ssl_certificate_key /etc/nginx/ssl/larry.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:8091;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering    off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
