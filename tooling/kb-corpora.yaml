# kb-corpora.yaml — corpora indexed by the local KB hybrid-search layer (kb_core.py).
# Paths may be absolute, ~-expanded, or repo-relative (resolved against KB_REPO_ROOT,
# default /mnt/rojaws/localDev). Dirs are walked for *.md. Everything stays on the LAN:
# embeddings come from Larry (mxbai-embed-large via the HTTPS proxy), vectors live in a
# local sqlite store — no egress.

corpora:
  # Index + topic files (split 2026-07-26 — the single files had grown past the
  # coder's 32k num_ctx). Index is listed too so a search can surface the map.
  al-reference:
    desc: AL syntax reference — topic files (syntax, objects, records/perf, events, agents, namespaces)
    paths: [setup/reference/AL-REFERENCE.md, setup/reference/al-reference/]

  al-knowledge:
    desc: AL platform / DevOps / features knowledge — topic files (platform, perf, testing, CI/CD, APIs)
    paths: [setup/reference/AL-KNOWLEDGE.md, setup/reference/al-knowledge/]

  al-talks:
    desc: Distilled BC/AL conference & community talk notes (topic-grouped; searchable tier, not auto-read)
    paths: [setup/reference/al-talks/]

  transcripts:
    desc: BC-agent video transcripts (raw source layer)
    paths: [setup/reference/transcripts/]

  al-patterns:
    desc: Curated AL pattern/knowledge base from al-assistant (standards, patterns, bc-apis, examples, integrations, naming)
    paths: [/mnt/rojaws/WorkDevGuideLines/al-assistant/knowledge/]

  bcapps-system:
    desc: BC System Application source (.al) — reusable platform modules (Email, Azure AD, HttpClient, Base64, Temp Blob, IsolatedStorage, …)
    paths: ["/mnt/rojaws/refs/BCApps/src/System Application"]

  bcapps-foundation:
    desc: BC Business Foundation source (.al) — core foundational objects
    paths: ["/mnt/rojaws/refs/BCApps/src/Business Foundation"]

  bctech-samples:
    desc: microsoft/BCTech curated AL samples (integration, Azure, patterns, how-tos)
    paths: ["/mnt/rojaws/refs/BCTech/samples"]

  bc-symbols:
    desc: Version-exact BC API surface flattened from .app SymbolReference.json (objects, fields, keys, public procedure signatures, events with real binding param names). Generated by symbols_to_kb.py — regenerable, not git-tracked. Query this to ground exact names/signatures.
    paths: ["/mnt/rojaws/refs/bc-symbols"]

  bcapps-gb:
    desc: BC GB (UK) localization + Contoso Coffee GB demo dataset — real modern AL in the local market
    paths: ["/mnt/rojaws/refs/BCApps/src/Apps/GB"]

  alae-w1:
    desc: microsoft/ALAppExtensions W1 feature apps (.al) — Sustainability, APIV2, agents (SalesOrder/Payables), EmailLogging, MasterDataManagement, EDocument connectors, Copilot suggestions, etc. (worldwide, not localizations)
    paths: ["/mnt/rojaws/refs/ALAppExtensions/Apps/W1"]

  al-merge:
    desc: Large merged AL knowledge export dump (~2MB)
    paths: [al_merge/al-knowledge-export.md]

  memory:
    desc: Claude memory-wiki (frontmatter + wikilinks)
    paths: [~/.claude/projects/-mnt-rojaws-localDev/memory/]

  bcquality:
    desc: MS BC/AL quality knowledge base (microsoft + community + custom layers)
    paths:
      - BCQuality/microsoft/knowledge/
      - BCQuality/community/knowledge/
      - BCQuality/custom/knowledge/

  bc-devitpro:
    desc: MS Learn "Development and administration" (dev-itpro) reference — full article set from the PDF export
    paths: [/mnt/rojaws/refs/bc-devitpro/]
